[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yanhai-trace"
version = "0.1.0"
description = "Evidence-grounded multi-agent scholarly discovery and personalized research training."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
documents = ["docling>=2.70", "pypdf>=5.0"]
test = ["coverage[toml]>=7.6"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
yanhai = "yanhai.server:main"
yanhai-qt = "yanhai.qt_app:main"
yanhai-api = "yanhai.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["yanhai"]
omit = [
    "src/yanhai/archive/*",
    "src/yanhai/qt_app.py",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
