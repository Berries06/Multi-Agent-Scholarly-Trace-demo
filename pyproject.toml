[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yanhai-trace"
version = "0.1.0"
description = "Evidence-grounded multi-agent scholarly discovery and personalized research training."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jsonschema>=4.23",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
]

[project.optional-dependencies]
desktop = [
    "httpx>=0.27",
    "PyQt6>=6.7",
]
test = [
    "coverage[toml]>=7.6",
    "httpx>=0.27",
]
labs = ["streamlit==1.60.0"]
submission = [
    "Pillow>=10",
    "python-docx>=1.1",
]
documents = ["docling>=2.70"]
tracking = ["mlflow>=3.7,<4"]
package = ["pyinstaller>=6.10"]

[project.scripts]
yanhai = "yanhai.api:main"
yanhai-desktop = "yanhai.qt_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["yanhai"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
