[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yanhai-trace"
version = "0.1.0"
description = "Evidence-grounded multi-agent scholarly discovery and personalized research training."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qt = ["PyQt6>=6.5"]

[project.scripts]
yanhai = "yanhai.server:main"
yanhai-qt = "yanhai.qt_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
