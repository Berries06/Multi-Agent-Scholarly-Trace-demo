name: P0 regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: p0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test tooling
        run: python -m pip install -e ".[test]"

      - name: Unit and integration tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report

      - name: Six-experiment smoke regression
        run: >-
          python -m tests.experiments.run_all
          --repetitions 1
          --output-root .tmp/ci-experiments

      - name: Frontend syntax check
        run: node --check web/app.js

      - name: Windows package manifest check
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/package_demo.ps1
          -OutputPath dist/yanhai-demo-ci.zip
