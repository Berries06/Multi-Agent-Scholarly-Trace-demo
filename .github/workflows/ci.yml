name: P0 regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: p0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install unified Python environment
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/环境/创建统一环境.ps1
          -SkipFrontend

      - name: Install React dependencies
        working-directory: frontend
        run: npm ci

      - name: Unified regression and frontend build
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/环境/运行全部测试.ps1

      - name: Six-experiment smoke regression
        run: >-
          .venv\Scripts\python.exe -m tests.experiments.run_all
          --repetitions 1
          --output-root .tmp/ci-experiments

      - name: PyQt frozen package check
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/构建桌面应用.ps1
          -Version ci
          -SkipTests
