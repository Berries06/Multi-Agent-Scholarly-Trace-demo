# Include this file inside the HTTPS server block for snowsong.top.
# Both upstreams listen on loopback only. The GLiNER upstream is supplied by
# a GPU-initiated SSH reverse tunnel and is never exposed directly to Internet.

location = /AgentDemo/lab {
    return 308 /AgentDemo/lab/;
}

location = /AgentDemo/lab/gliner {
    return 308 /AgentDemo/lab/gliner/;
}

location ^~ /AgentDemo/lab/gliner/ {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:18502;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @gliner_gpu_offline;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

location @gliner_gpu_offline {
    default_type text/plain;
    return 503 "GPU 实验节点当前离线。请由获授权成员在腾讯云控制台启动 GN7 实例，等待反向隧道恢复后重试。\n";
}

location ^~ /AgentDemo/lab/ {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
