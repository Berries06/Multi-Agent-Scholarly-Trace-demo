# Install as /etc/nginx/conf.d/agentdemo-rate-limit.conf.
# Debian's nginx.conf loads conf.d/*.conf inside the http context.
# 60r/m（平均每 2 秒 1 个请求）配 locations 里的 burst=20：
# 一次批量导入最多 20 篇、逐篇发请求，几十秒内发完 20 个也进得来；
# 原先 30r/m 会让批量导入的后半段撞 429。
limit_req_zone $binary_remote_addr zone=agentdemo_api:1m rate=60r/m;
