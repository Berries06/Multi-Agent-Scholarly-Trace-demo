# Include this file inside the HTTPS server block for snowsong.top.

location = /AgentDemo {
    return 308 /AgentDemo/;
}

location = /AgentDemo/start {
    return 308 /AgentDemo/start/;
}

location = /AgentDemo/install {
    return 308 /AgentDemo/install/;
}

# Static install page and release archives live below the existing site root:
# /var/www/mysite/AgentDemo/install/
location ^~ /AgentDemo/install/ {
    try_files $uri $uri/ =404;

    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

# Apply request limiting only to API traffic, not to HTML/CSS/JS assets.
location ^~ /AgentDemo/start/api/ {
    limit_req zone=agentdemo_api burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 6m;

    proxy_pass http://127.0.0.1:8766/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /AgentDemo/start;
    proxy_connect_timeout 10s;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
    proxy_buffering off;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

location ^~ /AgentDemo/start/ {
    proxy_pass http://127.0.0.1:8766/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /AgentDemo/start;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;

    # Ant Design v5 uses CSS-in-JS and injects style elements at runtime.
    # Keep scripts self-only while allowing those generated styles.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
